<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Confirmed</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="confirm.js"></script>
</head>
<body>
  <main class="card">
    <section class="header">
      <p class="eyebrow">Email Confirmation</p>
      <h1>Email Confirmed!</h1>
      <p class="lede">You can now sign in to your account.</p>
    </section>

    <section class="status-block success" id="statusBlock">
      <div class="checkmark" aria-hidden="true">✓</div>
      <div>
        <p class="status" id="statusText">Your email has been confirmed.</p>
        <p class="muted" id="statusSubtext">You can close this page and return to sign in.</p>
      </div>
    </section>

    <section class="footnotes">
      <p class="muted small">This page is secure and does not store any data.</p>
    </section>
  </main>

  <noscript>
    <div class="noscript">
      <p>Your email has been confirmed. You can close this page.</p>
    </div>
  </noscript>
</body>
</html>
