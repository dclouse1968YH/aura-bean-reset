<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Reset</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="reset.js"></script>
</head>
<body>
  <main class="card">
    <section class="header">
      <p class="eyebrow">Password Reset</p>
      <h1>Reset Your Password</h1>
      <p class="lede">Copy the code below and paste it in the app.</p>
    </section>

    <section class="status-block" id="statusBlock">
      <div class="spinner" aria-hidden="true"></div>
      <div>
        <p class="status" id="statusText">Reading reset link…</p>
        <p class="muted" id="statusSubtext">Keep this tab open. We'll open the app automatically.</p>
      </div>
    </section>

    <section id="codeCard" class="code-card hidden">
      <h2>Reset Code</h2>
      <p class="muted">Copy this code and paste it in the app to reset your password.</p>
      <div class="code-row">
        <code id="codeValue" aria-live="polite"></code>
        <button type="button" id="copyButton">Copy</button>
      </div>
      <p class="muted" id="emailHint"></p>
    </section>

    <div class="actions">
      <button type="button" id="openAppButton" class="hidden primary">
        Open App
      </button>
    </div>

    <section class="footnotes">
      <p class="muted small">This page is secure and does not store any data.</p>
    </section>
  </main>

  <noscript>
    <div class="noscript">
      <p>This page needs JavaScript enabled to process the password reset link. Copy the entire URL from this browser tab and contact support if you need help.</p>
    </div>
  </noscript>
</body>
</html>
